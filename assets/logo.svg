<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fovea logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2bd4c0"/>
      <stop offset="1" stop-color="#2c6fbb"/>
    </linearGradient>
    <radialGradient id="c" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#eafcff"/>
      <stop offset="1" stop-color="#2bd4c0"/>
    </radialGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="6" y="6" width="208" height="208" rx="46" fill="#0e1620"/>
  <rect x="6" y="6" width="208" height="208" rx="46" fill="none" stroke="url(#g)" stroke-width="4"/>
  <!-- aperture / fovea: concentric rings converging to a bright focused center -->
  <circle cx="110" cy="110" r="72" fill="none" stroke="url(#g)" stroke-width="6" opacity="0.35"/>
  <circle cx="110" cy="110" r="52" fill="none" stroke="url(#g)" stroke-width="6" opacity="0.6"/>
  <circle cx="110" cy="110" r="32" fill="none" stroke="url(#g)" stroke-width="6" opacity="0.9"/>
  <circle cx="110" cy="110" r="14" fill="url(#c)"/>
  <!-- pipeline "flow" tick marks entering the focus -->
  <g stroke="url(#g)" stroke-width="6" stroke-linecap="round">
    <line x1="110" y1="18" x2="110" y2="34"/>
    <line x1="110" y1="186" x2="110" y2="202"/>
    <line x1="18" y1="110" x2="34" y2="110"/>
    <line x1="186" y1="110" x2="202" y2="110"/>
  </g>
</svg>
